# TechPoint services

call_api:
  name: Call API
  description: Kald et vilkarligt TechPoint endpoint (relativt til /api/v1).
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    method:
      required: true
      selector:
        select:
          options: [GET, POST, PUT, PATCH, DELETE]
    path:
      required: true
      example: /management/doors/status
      selector:
        text: {}
    params:
      required: false
      selector:
        object: {}
    body:
      required: false
      selector:
        object: {}

get_cache:
  name: Get cache
  description: Emitter koordinatorens seneste snapshot (doors, areas, zones, events, ...).
  fields:
    entry_id:
      required: false
      selector:
        text: {}

management_set_door_status:
  name: Set door status
  description: Skift dor status (normal, release, permanent release, secure, block).
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    door_id:
      required: true
      selector:
        text: {}
    status:
      required: true
      selector:
        select:
          options: [Normal, Release, PermanentRelease, Secure, Block]

aia_update_zone:
  name: Update intrusion zone
  description: PUT /aia/zones/{zoneId}
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    zone_id:
      required: true
      selector:
        text: {}
    body:
      required: true
      selector:
        object: {}

aia_update_area:
  name: Update intrusion area
  description: PUT /aia/areas/{areaId}
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    area_id:
      required: true
      selector:
        text: {}
    body:
      required: true
      selector:
        object: {}

access_get_groups:
  name: List access groups
  description: GET /access/accessGroups
  fields:
    entry_id:
      required: false
      selector:
        text: {}

access_get_static_types:
  name: Get card option types
  description: GET /access/static/types
  fields:
    entry_id:
      required: false
      selector:
        text: {}

access_list_cardholders:
  name: List cardholders
  description: List cardholders (uses POST /access/cardHolders/filter internally, because GET /access/cardHolders often requires a single parameter)
  fields:
    entry_id:
      required: false
      selector:
        text: {}

access_list_cardholders_filter:
  name: Filter cardholders
  description: POST /access/cardHolders/filter (you can pass either the full wrapper {cardHolderFilter:{...}} or just the inner filter object)
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    filter:
      required: true
      selector:
        object: {}

access_create_cardholder:
  name: Create cardholder
  description: POST /access/cardHolders (numeric id is auto-assigned if missing; provide id.extId if you want a stable external id)
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    body:
      required: true
      selector:
        object: {}

access_update_cardholder:
  name: Update cardholder
  description: PUT /access/cardHolders
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    body:
      required: true
      selector:
        object: {}

access_delete_cardholder:
  name: Delete cardholder
  description: DELETE /access/cardHolders (id eller ext_id)
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    id:
      required: false
      selector:
        number:
          min: 1
    ext_id:
      required: false
      selector:
        text: {}

access_list_cards:
  name: List cards
  description: GET /access/cards
  fields:
    entry_id:
      required: false
      selector:
        text: {}

access_list_cards_filter:
  name: Filter cards
  description: POST /access/cards/filter (you can pass either the full wrapper {cardFilter:{...}} or just the inner filter object)
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    filter:
      required: true
      selector:
        object: {}

access_create_card:
  name: Create card
  description: POST /access/cards (numeric id is auto-assigned if missing)
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    body:
      required: true
      selector:
        object: {}

access_update_card:
  name: Update card
  description: PUT /access/cards (card_id + body)
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    card_id:
      required: true
      selector:
        number:
          min: 1
    body:
      required: true
      selector:
        object: {}

access_delete_card:
  name: Delete card
  description: DELETE /access/cards (id)
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    card_id:
      required: true
      selector:
        number:
          min: 1

management_get_global_door_control:
  name: Get global door control
  description: "GET /access/globalDoorControl – fetch current state. Returns: active (bool)."
  fields:
    entry_id:
      required: false
      selector:
        text: {}

management_set_global_door_control:
  name: Set global door control
  description: "POST /access/globalDoorControl – open (active: true) or release (active: false) all doors with global control enabled."
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    active:
      required: true
      selector:
        boolean: {}

management_get_threat_level:
  name: Get threat level
  description: "GET /management/threatLevel – fetch current threat level. Returns: level (0=off, 1=normal, 2–4=level 1–3)."
  fields:
    entry_id:
      required: false
      selector:
        text: {}

management_set_threat_level:
  name: Set threat level
  description: "POST /management/threatLevel – set threat level (0=off, 1=normal, 2=level 1, 3=level 2, 4=level 3)."
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    level:
      required: true
      selector:
        number:
          min: 0
          max: 4
          mode: box

config_get_io_inputs:
  name: Get user-defined inputs
  description: "GET /config/io/userdefined?ioType=28 – fetch all user-defined inputs and their state (0=passive, 2=active). Returns: inputs list."
  fields:
    entry_id:
      required: false
      selector:
        text: {}

config_get_io_outputs:
  name: Get user-defined outputs
  description: "GET /config/io/userdefined?ioType=29 – fetch all user-defined outputs and their state (0=passive, 2=active). Returns: outputs list."
  fields:
    entry_id:
      required: false
      selector:
        text: {}

config_set_io_userdefined:
  name: Set user-defined I/O state
  description: "POST /config/io/userdefined – set active (2) or passive (0) state for one or more user-defined inputs or outputs."
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    body:
      required: true
      example: '{"ios": [{"id": 1, "status": 2}]}'
      selector:
        object: {}

events_get:
  name: Get events
  description: GET /events
  fields:
    entry_id:
      required: false
      selector:
        text: {}
    since:
      required: false
      selector:
        text: {}
    until:
      required: false
      selector:
        text: {}
    limit:
      required: false
      selector:
        number:
          min: 1
          max: 10000
    filters:
      required: false
      selector:
        object: {}

door_set_status_by_entity:
  name: Set door status (entity)
  description: Set door status by selecting a TechPoint door entity (recommended).
  fields:
    entity_id:
      required: true
      selector:
        entity:
          integration: techpoint
    status:
      required: true
      selector:
        select:
          options: [Normal, Release, PermanentRelease, Secure, Block]

refresh:
  name: Refresh
  description: Trigger an immediate refresh of TechPoint data.
  fields:
    entry_id:
      required: false
      selector:
        text: {}

cleanup_orphan_devices:
  name: Cleanup orphan devices
  description: Remove legacy/orphan TechPoint devices that no longer have any entities.
  fields:
    entry_id:
      required: false
      selector:
        text: {}
