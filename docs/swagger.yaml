          description: Status 200
          content:
            application/json:
              schema:
                required:
                  - pollResponse
                type: object
                properties:
                  pollResponse:
                    $ref: '#/components/schemas/arPollResponse'
      tags:
        - API-Reader
  /apireader/userinput/card:
    post:
      description: Call on card read.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - cardCredentials
              properties:
                cardCredentials:
                  $ref: '#/components/schemas/arUserInputCard'
        required: true
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                required:
                  - credentialsResponse
                type: object
                properties:
                  credentialsResponse:
                    $ref: '#/components/schemas/arUserInputResponse'
      tags:
        - API-Reader
  /apireader/userinput/cardPin:
    post:
      description: Call on card pin read.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - cardPinCode
              properties:
                cardPinCode:
                  $ref: '#/components/schemas/arUserInputCardPin'
        required: true
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                required:
                  - credentialsResponse
                type: object
                properties:
                  credentialsResponse:
                    $ref: '#/components/schemas/arUserInputResponse'
      tags:
        - API-Reader
  /apireader/userinput/cardless:
    post:
      description: Call on cardless read (e.g. pin entered instead of card).
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - cardlessCredentials
              properties:
                cardlessCredentials:
                  $ref: '#/components/schemas/arUserInputCardless'
        required: true
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                required:
                  - credentialsResponse
                type: object
                properties:
                  credentialsResponse:
                    $ref: '#/components/schemas/arUserInputResponse'
      tags:
        - API-Reader
  /apireader/userinput/keypad:
    post:
      description: Call when user has pressed keys on keypad.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - keypadData
              properties:
                keypadData:
                  $ref: '#/components/schemas/arUserInputKeypad'
        required: true
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/arEmptyResponse'
      tags:
        - API-Reader
  /apireader/management/input:
    post:
      description: Manage the state of reported inputs.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - controlInput
              properties:
                controlInput:
                  $ref: '#/components/schemas/arControlInput'
        required: true
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/arEmptyResponse'
      tags:
        - API-Reader
tags:
  - name: Events
  - name: Management
  - name: Access
  - name: General
  - name: Configuration
  - name: System
  - name: Proxy
  - name: API-Reader
servers:
  - url: 'https://192.168.1.123/api/v1'
components:
  parameters:
    userdefinedfilter:
      name: ioType
      in: query
      description: Select by type. 28 or 29 is valid
      required: true
      schema:
        $ref: '#/components/schemas/userdefinedfilter'
    paramCrossId:
      name: id
      in: query
      description: Select by cross id
      required: false
      schema:
        $ref: '#/components/schemas/crossId'
    paramId:
      name: id
      in: query
      description: Select by id
      required: false
      schema:
        $ref: '#/components/schemas/id'
  requestBodies:
    userdefinedio:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              ids:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      example: "0"    
                    status:
                      type: integer
                      example: 0    

    doorFilter:
      content:
        application/json:
          schema:
            type: object
            required:
              - doorFilter
            properties:
              doorFilter:
                $ref: '#/components/schemas/doorFilter'
      required: true
    readerFilter:
      content:
        application/json:
          schema:
            type: object
            required:
              - readerFilter
            properties:
              readerFilter:
                $ref: '#/components/schemas/readerFilter'
      required: true
    accessGroup:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/accessGroup'
      required: true
    card:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/card'
      required: true
    cardAccess:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cardAccess'
      required: true
    cardHolder:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/cardHolder'
      required: true
    weekProgram:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/weekProgram'
      required: true
    holiday:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/holiday'
      required: true
    accessSchedule:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/accessSchedule'
      required: true
    accessScheduleFilter:
      content:
        application/json:
          schema:
            type: object
            required:
              - accessScheduleFilter
            properties:
              accessScheduleFilter:
                $ref: '#/components/schemas/accessScheduleFilter'
      required: true
    intrusionFilter:
      content:
        application/json:
          schema:
            type: object
            required:
              - intrusionFilter
            properties:
              intrusionFilter:
                $ref: '#/components/schemas/intrusionFilter'
      required: true
    intrusionCommand:
      content:
        application/json:
          schema:
            type: object
            required:
              - intrusionCommand
            properties:
              intrusionCommand:
                $ref: '#/components/schemas/intrusionCommand'
      required: true
    eventClearCommand:
      content:
        application/json:
          schema:
            type: object
            required:
              - eventClearCommand
            properties:
              eventClearCommand:
                $ref: '#/components/schemas/eventClearCommand'
      required: true
    apbStatusFilter:
      content:
        application/json:
          schema:
            type: object
            required:
              - apbStatusFilter
            properties:
              apbStatusFilter:
                $ref: '#/components/schemas/apbStatusFilter'
      required: true
    apbCommand:
      content:
        application/json:
          schema:
            type: object
            required:
              - apbCommand
            properties:
              apbCommand:
                $ref: '#/components/schemas/apbCommand'
      required: true
    keyboxGroupFilter:
      content:
        application/json:
          schema:
            type: object
            required:
              - keyboxGroupFilter
            properties:
              keyboxGroupFilter:
                $ref: '#/components/schemas/keyboxGroupFilter'
      required: true
    keyboxCommand:
      content:
        application/json:
          schema:
            type: object
            required:
              - keyboxCommand
            properties:
              keyboxCommand:
                $ref: '#/components/schemas/keyboxCommand'
      required: true
  securitySchemes:
    Basic_authentication:
      description: All communication must be over HTTPS.
      type: http
      scheme: basic
  schemas:
    userdefinedfilter:
      type: object
      properties:
        ioFilter:
          type: object
          properties:
            ioType:
              type: integer
              example: 28
    userDefinedIOs:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        iotype:
          type: integer
          description: |-
            28 -> inputs
            29 -> outputs
        techpoint:
          type: integer
        state:
          type: integer
          description: |-
            0 -> passive
            2 -> active
        statename:
          type: string
        time:
          type: string
          format: date-time

    threatLevelStatus:
      type: object
      properties:
        currentThreatLevel:
          type: object
          properties:
            level:
              type: integer
              description: |-
               0 -> Threat level off
               1 -> Threat level normal
               2 -> Threat level 1
               3 -> Threat level 2
               4 -> Threat level 3
              example: 0
    threatLevelControl:
      type: object
      properties:
        threatLevel:
          type: object
          properties:
            newThreatlevel:
              type: integer
              description: |-
               0 -> Threat level off
               1 -> Threat level normal
               2 -> Threat level 1
               3 -> Threat level 2
               4 -> Threat level 3
              example: 0
    globaldoorStatus:
      type: object
      properties:
        status:
          type: object
          properties:
            active:
              type: boolean
              description: test
              example: true
    apiInfo:
      type: object
      required:
        - version
      properties:
        version:
          $ref: '#/components/schemas/version'
    accessCardOptionStaticInfo:
      type: object
      description: |-
        Card option static information.
        Note that card options 4 and 8 are no longer supported (from TechPoint v3.1.0) and new option 13 is added (from TechPoint v3.7.2).
      required:
        - id
        - name
        - info
      properties:
        id:
          type: integer
        name:
          type: string
        info:
          type: string
    accessGroup:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/crossId'
        info:
          type: string
          example: Access to main door
        name:
          type: string
          example: Main entry
        priority:
          type: integer
          default: 50
          minimum: 10
          maximum: 50
          example: 50
          description: Lower number has higher priority. Reusable access groups have priority between 10 and 50. Range between 1 and 9 is reserved for access groups that are non reusable.
        isReusable:
          type: boolean
          default: true
          description: 'When inserting/updating access group this must be set to true. Specifies whether access group is shared/reused between cards. When TechPoint is running in simple access mode (without access groups visible to user), access groups are used in the background and their isReusable field is set to false and they can be used only for single access card.'
        accessRights:
          type: array
          items:
            $ref: '#/components/schemas/accessRight'
    accessRight:
      type: object
      required:
        - doorID
        - accessGroupID
        - weekProgramID
      properties:
        doorID:
          $ref: '#/components/schemas/id'
        accessGroupID:
          $ref: '#/components/schemas/crossId'
        weekProgramID:
          $ref: '#/components/schemas/crossId'
      description: |-
        Insert/update supported from v0.9.1. When inserting/updating access rights as part of accessGroup object, make sure you set accessGroupID field to null or leave it out or set it to exact id of accessGroup object.

        Week program id must have value of 1, 2 or 3 (built in week programs) or reference some user defined access week program.
        Week program id 1 is No access, id 2 is Access with pin, and id 3 is Access without pin.   
    accessTypesStaticConfig:
      type: object
      description: Access types static information
      required:
        - deviceVersion
        - cardOptions
      properties:
        deviceVersion:
          $ref: '#/components/schemas/version'
        cardOptions:
          type: array
          items:
            $ref: '#/components/schemas/accessCardOptionStaticInfo'
    accessSchedule:
      description: 'Access schedule, containing default configuration (functions that are applied when target records function is not specified), schedule targets records (currently doors and access groups) that can be used, and finally, periods which are schedule period with validity period and optional function for each period.'
      type: object
      required:
        - name
      properties:
        id:
          $ref: '#/components/schemas/id'
        name:
          type: string
        info:
          type: string
        defaults:
          type: array
          items:
            $ref: '#/components/schemas/accessScheduleDefault'
        targets:
          type: array
          items:
            $ref: '#/components/schemas/accessScheduleTarget'
        periods:
          type: array
          items:
            $ref: '#/components/schemas/accessSchedulePeriod'
    accessScheduleDefault:
      description: Functions that are applied when target records function is not specified.
      type: object
      required:
        - tableId
        - function
      properties:
        tableId:
          type: integer
          description: Currently supported values are 4001 for doors and 5002 for access groups.
        function:
          type: integer
          description: |-
            Function value depend on tableId. 
            Supported values for doors:
            - 1: Perm Open
            - 2: Blocked
            - 3: Normal
            - 5: Always pincode
            - 6: Perm after card
            - 7: Toggle
            - 8: Allow toggle input
            Note: value 4 is not used.

            For access groups, only supported value is null which represents No Access.
    accessScheduleTarget:
      description: These is record to which access schedule is to be applied.
      type: object
      required:
        - record
      properties:
        record:
          $ref: '#/components/schemas/tableRecord'
    accessScheduleFunction:
      description: 'See accessScheduleDefault description, it fully matches this one.'
      type: object
      required:
        - tableId
        - function
      properties:
        tableId:
          type: integer
          description: 'See accessScheduleDefault description for allowed values for tableId.         '
        function:
          type: integer
          description: See accessScheduleDefault description for allowed values for function.
    accessSchedulePeriod:
      description: These is period to which access schedule is to be applied.
      type: object
      required:
        - validFrom
        - validTo
      properties:
        validFrom:
          type: string
          format: date-time
          description: Must be in the future.
        validTo:
          type: string
          format: date-time
          description: Must be in the future.
        functions:
          type: array
          items:
            $ref: '#/components/schemas/accessScheduleFunction'
    accessScheduleFilter:
      description: |-
        <strong>This type inherits all fields from baseRecordFilter</strong>
        <br/>      
        Represents filter for access schedules query. 
        <br/>
        All fields are optional, thus leaving this as empty object wil result in retreival of all entries.
        <br/>
        If you only want count of records matching your criteria, set doNotFetchData to true.
        If you specify multiple fields, they are all applied (AND operator).
      type: object
      properties:
        id:
          $ref: '#/components/schemas/id'
        validFrom:
          type: string
          format: date-time
        validTo:
          type: string
          format: date-time
        targets:
          type: array
          items:
            $ref: '#/components/schemas/accessScheduleTarget'
    accessScheduleFilterResult:
      description: The result of requested access schedules with applied filter.
      type: object
      required:
        - count
        - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/apbStatus'
          description: 'It will be empty or null if there is no data or accessScheduleFilter.doNotFetchData is set to true.            '
        count:
          type: integer
          description: 'Total count matching query criteria, skipCount and limitCount parameters are discarded. This is not the count of records array.          '
    apbConfig:
      description: Represents APB settings for an area. It is contained inside intrusionContainer when it represents an area. The value inside intrusionContainer will be null in case non area intrusionContainer and in case APB is disabled for an area.
      type: object
      required:
        - isApbEnabled
        - isParking
        - isLimitEnabled
        - limitCount
        - apbLevel
      properties:
        isApbEnabled:
          type: boolean
          description: True if APB is enabled.
          example: true
        isParking:
          type: boolean
          description: True for parking area.
          example: false
        isLimitEnabled:
          type: boolean
          description: True if area card limit count is enabled.
          example: false
        limitCount:
          type: integer
          description: Nullable. Maximum number of cards allowed in area. Null in case limit is disabled (when isLimitEnabled is false).
          minimum: 0
          example: null
        apbLevel:
          type: integer
          minimum: 0
          maximum: 3
          description: |-
            The APB level determines how APB is operated by the system for the area:
            - 0: None,
            - 1: Reset every hour,
            - 2: Reset every midnight,
            - 3: Always
          default: 0
    apbStatus:
      description: 'Represents current APB status (presence).  <br/> The parking related fields (parkAreaId, parkAreaName, parkAreaIoId, parkDoorName, parkReaderName, parkTime) will be omitted in case no parking information is present (when parkAreaId is null). Details information fields (holderFirstName, holderMiddleName, holderLastName, holderInfo, areaName, doorName, readerName, parkAreaName, parkDoorName, parkReaderName) will be omitted by default - they may be included on explicit request. <br/> If areaId is not null, it represents the current location area for given card in which case doorId and readerId show which door and reader were used to enter the area. Similar with parking - parkAreaId, parkDoorId, parkReaderId.  <br/> It is important to understand that <strong>single card maybe in two different areas at the same time (one of them being parking area). </strong> <br/> Note that id field is generated on the fly and has no special meaning other than help in case of paging through a lot of data. <br/> If card is free (APB freed, not in any area), areaId and related fields will be null. If card is free and not in parking area, there will be no status entry for the card.'
      type: object
      required:
        - id
        - timeStamp
        - cardId
        - cardTableId
        - cardType
        - cardNumber
        - holderId
        - holderType
        - areaId
        - areaIoId
        - doorId
        - readerId
        - flags
      properties:
        id:
          $ref: '#/components/schemas/id'
        timeStamp:
          type: string
          format: date-time
          description: Time stamp of last change in APB status (when card has entered the area).
        cardId:
          $ref: '#/components/schemas/id'
        cardTableId:
          type: integer
          description: 'In case integration with external system, the used card table id might have non default value to indicate its origin. Default value of 5001 represent regular card.'
          default: 5001
        cardType:
          type: integer
          description: It will typically be standard card type (0). The other card type is keybox (1) which is not used in APB.
          default: 0
        cardNumber:
          type: string
          example: '12345678'
        holderId:
          $ref: '#/components/schemas/id'
        holderType:
          type: integer
          description: |-
            The following types maybe present depening of device build and installed licenses:
            - 0: Standard,
            - 1: Quick,
            - 2: Thorguard,
            - 3: Conventus,
            - 4: TechVisitor,
            - 5: Salto SHIP
          default: 0
        holderFirstName:
          type: string
        holderMiddleName:
          type: string
        holderLastName:
          type: string
        holderInfo:
          type: string
        areaId:
          $ref: '#/components/schemas/id'
        areaName:
          type: string
        areaIoId:
          $ref: '#/components/schemas/id'
        doorId:
          $ref: '#/components/schemas/id'
        doorName:
          type: string
        readerId:
          $ref: '#/components/schemas/id'
        readerName:
          type: string
        parkAreaId:
          $ref: '#/components/schemas/id'
        parkAreaName:
          type: string
        parkAreaIoId:
          $ref: '#/components/schemas/id'
        parkDoorId:
          $ref: '#/components/schemas/id'
        parkDoorName:
          type: string
        parkReaderId:
          $ref: '#/components/schemas/id'
        parkReaderName:
          type: string
        parkTime:
          type: string
          format: date-time
          description: Time stamp of last change in APB status for park related fields.
        flags:
          type: integer
          default: 0
          description: |-
            For advanced usage.
            More internal details on APB state. It is a bit mask with following values (hex):
            - 0x01: Free,
            - 0x02: Was free,
            - 0x04: Leave parking (card left the parking area),
            - 0x08: Enter parking (card is entering parking area),
            - 0x10: Vehicle have left the parking area.
    apbStatusFilter:
      description: '<strong>This type inherits all fields from baseRecordFilter</strong> <br/>       Represents filter for current APB status (presence) query.  <br/> All fields are optional, thus leaving this as empty object wil result in retreival of all entries. <br/> If you only want count of records (e.g. how many cards are in the specified area), set doNotFetchData to true.'
      type: object
      properties:
        areaIDs:
          $ref: '#/components/schemas/idArray'
        cardIDs:
          $ref: '#/components/schemas/idArray'
        cardHolderIDs:
          $ref: '#/components/schemas/idArray'
        cardTableId:
          type: integer
          description: See desciption under apbStatus.cardTableId
          default: 5001
        cardType:
          type: integer
          description: See options under apbStatus.cardType
        cardHolderType:
          type: integer
          description: See options under apbStatus.holderType
        doorIDs:
          $ref: '#/components/schemas/idArray'
        readerIDs:
          $ref: '#/components/schemas/idArray'
        includeDetails:
          type: boolean
          default: false
          description: 'If true, then detailed fields in apbStatus will included in the response (such as area name, door name, card holder name etc.).'
        applyToPark:
          type: boolean
          default: null
          description: |-
            If null (default), then filtering will be applied both on parking and non parking related fields. If true, then filtering will be applied to parking related fields in apbStatus. If false, then filtering will be applied to non parking fields in apbStatus.
            <br>
            For example, if you specify areaIDs and leave this field as default (null) you will get apbStatus in case specified area(s) has presence either as regular or as parking presence. On the other hand, if you set this to false you will get only non parking presence, while setting this to true will include only parking presence.
    apbStatusResult:
      description: The result of requested APB status with applied filter.
      type: object
      required:
        - count
        - records
      properties:
        records:
          type: array
          items:
            $ref: '#/components/schemas/apbStatus'
          description: 'It will be empty or null if there is no data or apbStatusFilter.doNotFetchData is set to true.            '
        count:
          type: integer
          description: 'Total count matching query criteria, skipCount and limitCount parameters are discarded. This is not the count of records array.            '
    apbCommand:
      description: 'Execute apb command.  <br/> See command description for more info. <br/> If specified command requires area (srcAreaId, destAreaId), that area must be APB enabled.  <br/> If specified command requires cardIDs, there must be at least one entry in the array and all specified card IDs must exist in database. <br/> If specified command requires that area (srcAreaId, destAreaId) is not specified, the field may be omitted or have null id value. <br/> If specified command requires that cardIDs must not be specified, the array may be omitted, null or empty. <br/> If specified command requires that cardTableId is not specified, the field may be omitted or null.'
      type: object
      required:
        - command
      properties:
        command:
          type: integer
          minimum: 1
          maximum: 5
          description: |-
            The following command are supported:
            - 1: Move one or more cards to destination area. 
            Must be specified: cardIDs, destAreaId. May be specified: cardTableId. Must not be specified: srcAreaId.
            - 2: Move all cards from source area to destination area.
            Must be specified: srcAreaId, destAreaId. Must not be specified: cardIDs, cardTableId.
            - 3: Free one or more cards. 
            Must be specified: cardIDs. May be specified: cardTableId. Must not be specified: srcAreaId, destAreaId.
            - 4: Free all cards in source area.
            Must be specified: srcAreaId. Must not be specified: cardIDs, cardTableId, destAreaId.
            - 5: Free all cards
            Must not be specified: cardIDs, cardTableId, srcAreaId, destAreaId.
          example: 1
        cardIDs:
          type: array
          items:
            $ref: '#/components/schemas/id'
          minItems: 1
          maxItems: 100
        cardTableId:
          type: integer
          description: See desciption under apbStatus.cardTableId
          default: 5001
        srcAreaId:
          $ref: '#/components/schemas/id'
        destAreaId:
          $ref: '#/components/schemas/id'
    baseRecordFilter:
      description: This is base type/class for record filter types. The properties are specified here in order to avoid repeating it in child types spec.
      type: object
      properties:
        skipCount:
          type: integer
          description: Used for paging through data.
          default: 0
        limitCount:
          type: integer
          default: 100
          minimum: 1
          maximum: 1000
        doNotFetchData:
          type: boolean
          description: 'If true, only record count will be returned and no data.'
          default: false
    crossId:
      type: object
      properties:
        id:
          type: integer
          description: id assigned by TechPoint.
        extId:
          type: string
          description: 'This is external id, the id coming from the external system that is managing TechPoint.'
      description: |-
        This type is used to support saving external system id toghether with TechPoint generated id.

        Regarding IDs, external system (API user) can behave in the following modes:
        - Use its own ids, completely disregarding internal IDs used by TechPoint (for objects that support this type). In this case, when inserting records, extId would be specified.
        - Let TechPoint assign the IDs, and use them, possibly making a mapping table between external system ids and TechPoint generated IDs. In this case, when inserting records, extId would not be specified. In this mode TechPoint will run faster.

        **When used for filtering records, only one of two fields (id or extId) can be specified; if one is specified, the other one must be omitted or set to null.**

        Note that internally, TechPoint will always use its own ids, e.g. in event log details the owner id will always be TechPoint generated id. When appropriate, this API will expose this type.
    crossIdArray:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
            $ref: '#/components/schemas/crossId'
      description: |-
        Inside array they must not be mixed recordId types;
        If id is used inside first entry, then it must be used for all.
        If extId is used first entry, then it must be used for all.   
    card:
      type: object
      required:
        - cardHolderID
        - id
        - number
      properties:
        accessGroupLinks:
          type: array
          items:
            $ref: '#/components/schemas/cardAccessGroupLink'
        cardHolderID:
          $ref: '#/components/schemas/crossId'
        id:
          $ref: '#/components/schemas/crossId'
        isBlocked:
          type: boolean
          default: false
        number:
          type: string
          example: '12345678'
        pinCode:
          type: string
          example: '5762'
        options:
          type: array
          description: |-
            <strong> Please use GET /access/static/types to fetch all supported card options (from API v1.6.0). </strong>
            <br/>
            You may specify one or more options. To clear all options specify empty array. The supported options are as follows.
            0 : Whitelist Card (Emergency card for wireless lock),
            1 : Allow blocked doors (Can open door event if it is blocked),
            2 : Overrule APB (Antipass back not respected),
            3 : Trace card (Trace where card is used),
            <del>4 : Intrusion rights (Allow intrusion action)</del>,
            5 : Approver (Can approve two-man rule access),
            6 : Firefighter card (Firefighter card - unlimited access),
            7 : Disabled person (Extended door timing),
            <del>8 : Overrule intrusion set (Allow access if intrusion unset error/timeout)</del>,
            9 : Allow keypad commands (Allow controlling permanently and blocking door from keypad),
            10 : Use Secondary offline validity period (Uses secondary validity period),
            11 : Global Offline card (Card can be used across multiple sites),
            12 : Readout offline alarms (Fetch offline door alarms, e.g battery alarms)
            13 : Include offline blacklisted cards (Including black listed cards /longer encoding time)
          items:
            type: integer
