    eventFilter:
      type: object
      description: |
        <strong>This type inherits all fields from baseRecordFilter</strong> <br/> If id is specified, all other fields are discarded. 
        skipCount can be used to page through records. 
        All fields are optional and if are specified and not null, the filter is applied by making sure all parameters are respected with one exception: if event matches eventTypes but does not match eventDetailsTypes it will be still included (all event details for that event will be returned).
        Event types, event details types, and event type tags id values will be supplied to API customer.
        To get total event count, you may pass eventFilter with only single field, where doNotFetchData is set to true.            
      properties:
        eventTypes:
          type: array
          items:
            type: integer
        greaterThenEventID:
          $ref: '#/components/schemas/id'
        lowerThenEventID:
          $ref: '#/components/schemas/id'
        greaterThenEventTime:
          type: string
          format: date-time
        lowerThenEventTime:
          type: string
          format: date-time
        id:
          $ref: '#/components/schemas/id'
        clearedType:
          type: integer
          default: null
          minimum: 1
          maximum: 3
          description: |-
            The following options are supported:
            - 1: Only cleared events will be returned.
            - 2: Only uncleared clearable events (alarms/alerts)  will be returned. Auto clearable uncleared events will be excluded. i.e., only events that can be cleared by end user and are not yet cleared will be returned.
            - 3: Only uncleared clearable AND uncleared auto clearable events (alarms/alerts) will be returned.
          example: 2
        eventTypeTags:
          type: array
          items:
            type: integer
        techPoints:
          $ref: '#/components/schemas/idArray'
    eventFilterResult:
      type: object
      required:
        - count
        - records
      properties:
        records:
          type: array
          description: It will be null if there is no data or doNotFetchData is set to true.
          items:
            $ref: '#/components/schemas/event'
        count:
          type: integer
          description: 'Total count matching query criteria, skipCount and limitCount parameters are discarded. This is not the count of records array.'
    eventClearCommand:
      type: object
      description: 'If doClearAll is set to true then eventIDs must be null, omitted or have 0 entries. If eventIDs has one or more entries, doClearAll must be null, omitted or set to false. Maximum ids in eventIDs is 100.'
      properties:
        doClearAll:
          type: boolean
          description: 'If true, all alarms will be cleared.'
          default: false
        eventIDs:
          $ref: '#/components/schemas/idArray'
    eventClearResult:
      type: object
      required:
        - clearedCount
        - requestedCount
      description: Result of event clear command.
      properties:
        clearedCount:
          type: integer
          description: Number of events that have been cleared.
        requestedCount:
          type: integer
          description: Number of event IDs requested to be cleared. Null in case clear all was executed.
    eventTypesStaticConfig:
      type: object
      description: Event types/tags static information.
      required:
        - deviceVersion
        - eventTypes
        - eventTags
      properties:
        deviceVersion:
          $ref: '#/components/schemas/version'
        eventTypes:
          type: array
          items:
            $ref: '#/components/schemas/eventTypeStaticInfo'
        eventTags:
          type: array
          items:
            $ref: '#/components/schemas/eventTagStaticInfo'
    eventTypeStaticInfo:
      type: object
      required:
        - id
        - name
        - isAutoCleared
      description: Event type static information.
      properties:
        id:
          type: integer
          description: Event type id.
        name:
          type: string
          description: Event type name.
        isAutoCleared:
          type: boolean
          description: 'True in case event type can only be cleared by system itself (after the issue has been resolved). False in case event type can be cleared only by end user. Null in case event type is not clearable at all, i.e. there is no linked event tag with isClearable set to true for this event type.'
    eventTagStaticInfo:
      type: object
      required:
        - id
        - name
        - isClearable
        - parentId
        - linkedEventTypeIDs
        - children
      description: Event tag static information. It is organized as tree structure.
      properties:
        id:
          type: integer
          description: Event tag id.
        name:
          type: string
          description: Event tag name.
        isClearable:
          type: boolean
          description: 'True in case event type to which this tag is applied can be cleared (typically alarms/alerts). If you want to clear linked event type, even when this property is true, you neeed to make sure that event type isAutoCleared is false, otherwise you will not be able to clear the event.'
        parentId:
          type: integer
          description: Parent event tag id. Null in case of top level tag.
        linkedEventTypeIDs:
          type: array
          description: Event type id-s that this tag applies to. Null in case no linked event types.
          items:
            type: integer
        children:
          type: array
          description: Child event tags (eventTagStaticInfo). Null in case no children.
          items:
            $ref: '#/components/schemas/eventTagStaticInfo'
    eventWebHook:
      type: object
      required:
        - eventFilter
        - url
      properties:
        url:
          type: string
          description: 'Webhook URL for push event notifications. If empty or null, webhook is considered disabled.'
        eventFilter:
          $ref: '#/components/schemas/eventFilter'
        userName:
          type: string
        password:
          type: string
        authType:
          type: string
          default: None
          enum:
            - 'None, Basic'
      description: |-
        TechPoint will make a POST  to URL that will contain JSON object of type **eventFilterResult**  whenever specified event filter is triggered.
        We recommend that URL is HTTPS but it is not required.
        Authentication will be used as specified in authType.
        if authType is None, no authentication will be performed.
        if authType is Basic or Digest, then userName must be specified.
        If API user needs some other type of authentication, it can be added.
    generalTypesStaticConfig:
      type: object
      description: Static types used in the system. Tables is array of internal tables. It could be useful for better understaning of e.g. event log details where table id is used (tableRecord). "System_" and "Static_" tables are excluded.
      required:
