  version: '1'
  title: TechPoint API
  contact:
    name: Mevludin Opardija
    email: meo@techsolutions.dk
    url: 'http://www.techsolutions.dk/products/techpoint-ip-door-controller'
  license:
    name: TechSolutions A/S. All rights reserved.
security:
  - Basic_authentication: []
paths:
  /info/api:
    get:
      description: 'General API and system  information, version etc.'
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/apiInfo'
      tags:
        - General
  /ping:
    get:
      description: Fast ping. Recommended for watchdog ping. Returns empty response.
      responses:
        '200':
          description: Status 200
      tags:
        - General
  /techpoints:
    get:
      description: 'Get list of all TechPoints (usefull in multi TechPoint mode). To fetch realtime sync status text in response, specify getSyncStatus with value equal to 1. e.g. /techpoints?getSyncStatus=1'
      parameters:
        - name: getSyncStatus
          in: query
          required: false
          description: Specify the parameter if you want response to include realtime sync status value (techPoint.syncStatusText).
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                required:
                  - records
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/techPoint'
      tags:
        - General
  /domains:
    get:
      description: 'Get Domain(s). If id is omitted, all Domains will be returned. If the system is not running in Domains mode, empty array will be returned.'
      parameters:
        - $ref: '#/components/parameters/paramId'
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                required:
                  - records
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/domain'
      tags:
        - General
  /idmap:
    delete:
      description: Delete cross records
      responses:
        '200':
          description: Deleted.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - recordIDs
              properties:
                recordIDs:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/tableCrosstableidRecord'
        required: true
      tags:
        - General
    post:
      description: |-
        Used to set external id for existing (already inserted) record (identified by table id and record id). Ignore techPointId field inside tableCrossRecord.
        Note: you can set external id only for a record if it hasn't been set already.
        Max number of array elements is 50.
      responses:
        '200':
          description: Status 200
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - recordIDs
              properties:
                recordIDs:
                  type: array
                  maxItems: 50
                  items:
                    $ref: '#/components/schemas/tableCrossRecord'
                '':
                  type: string
                  x-stoplight:
                    id: vt6va7lytni9h
        required: true
      tags:
        - General
  /general/static/types:
    get:
      description: Get general static types configuration including table ids/names. Note that you will always get the same result form the same TechPoint version. The configuration might change between TechPoint versions.
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                required:
                  - generalTypesStaticConfig
                type: object
                properties:
                  generalTypesStaticConfig:
                    $ref: '#/components/schemas/generalTypesStaticConfig'
      tags:
        - General
  /access/static/types:
    get:
      description: Get access related static types configuration including card options. Note that you will always get the same result form the same TechPoint version. The configuration might change between TechPoint versions.
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                required:
                  - accessTypesStaticConfig
                type: object
                properties:
                  accessTypesStaticConfig:
                    $ref: '#/components/schemas/accessTypesStaticConfig'
      tags:
        - Access
  /access/accessGroups:
    get:
      description: |-
        Get access group(s). If no parameters are specified, all access groups are returned. If id is specified, name must be omitted.
        From v0.9.0 accessRights array is returned as part of accessGroup object.
      parameters:
        - $ref: '#/components/parameters/paramCrossId'
        - name: name
          in: query
          required: false
          description: Access group name. id must be omitted if this is used.
          schema:
            type: string
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                required:
                  - records
                type: object
                properties:
                  records:
                    type: array
                    items:
                      $ref: '#/components/schemas/accessGroup'
      tags:
        - Access
    post:
      description: |-
        Insert access group.
        Access rights insert is supported from v0.9.1.
      responses:
        '200':
          description: Status 200
          content:
            application/json:
              schema:
                type: object
                description: New accessGroup.id.id will be assigned.
                properties:
                  accessGroup:
                    $ref: '#/components/schemas/accessGroup'
      tags:
        - Access
      requestBody:
        $ref: '#/components/requestBodies/accessGroup'
    put:
      description: Update access group.  Omitted fields are not updated.  Id cannot be updated. Access rights update is supported from v0.9.1.
      responses:
        '200':
          description: Status 200
      tags:
        - Access
      requestBody:
        $ref: '#/components/requestBodies/accessGroup'
    delete:
      description: 'Delete access group, linked access rights, and links to cards.'
      parameters:
        - $ref: '#/components/parameters/paramCrossId'
      responses:
        '200':
          description: Deleted.
      tags:
        - Access
  /access/cards:
    get:
      description: |-
        Get single card.
        One of query parameters must be specified.
