    intrusionProfile:
      description: 'Every intrusion action must be executed under intrusion profile that specifies which actions are allowed on which objects and when (controlled by a week program). The intrusion profile can be assigned to Web/API user account, card holder, card.'
      type: object
      required:
        - id
        - name
        - isSystem
      properties:
        id:
          $ref: '#/components/schemas/id'
        name:
          type: string
        info:
          type: string
          description: Nullable
        isSystem:
          type: boolean
          description: Set to true in case of system built-in profile.
          default: false
    intrusionContainer:
      type: object
      description: 'Intrusion container is flexible type and may represent multiple types; Zone, Wired zone, Area or Area group. Area group contains Areas. Area may contain apbConfig (null if APB is disabled), Zones and Wired zone. Every intrusion container has its linked IO object ("ioId" is its ID). This is important because "ioId" is used when using management command e.g., set/unset Area and filtering. Every intrusion container object also has its ioType ("ioType", the type of "ioId"). Field "childrenIoIDs" may be present only in case of Area and Area group and it contains all intrusion child IO object IDs (IO objects linked to Zones, Wired zones or Areas that are the children). "apbConfig", "zones" and "wiredZones" fields are present only for Area. "areas" are only present for Area group.'
      required:
        - id
        - name
        - ioId
        - ioType
      properties:
        id:
          $ref: '#/components/schemas/tableRecord'
        name:
          type: string
          description: Nullable
        ioId:
          $ref: '#/components/schemas/id'
        ioType:
          type: integer
          description: |-
            - 16: Zone,
            - 17: Area,
            - 18: Wired zone,
            - 19: Area group
        childrenIoIDs:
          $ref: '#/components/schemas/idArray'
        type:
          type: integer
          description: |-
            Only available in case of Zones and Wired zones:  
            - 0: Not configured,
            - 1: Intrusion,
            - 2: Technical,
            - 3: Soft sabotage
            - 4: Holdup
            - 5: Fire
            - 6: Duress
            - 7: Mains fault
        apbConfig:
          $ref: '#/components/schemas/apbConfig'
        zones:
          type: array
          description: This is present only for Areas (when ioType is 17). It is array of intrusionContainer objects.
          items:
            $ref: '#/components/schemas/intrusionContainer'
        wiredZones:
          type: array
          description: This is present only for Areas (when ioType is 17). It is array of intrusionContainer objects.
          items:
            $ref: '#/components/schemas/intrusionContainer'
        areas:
          type: array
          description: This is present only for Area groups (when ioType is 19). It is array of intrusionContainer objects.
          items:
            $ref: '#/components/schemas/intrusionContainer'
    intrusionFilter:
      description: |-
        <strong>This type inherits all fields from baseRecordFilter</strong>
        <br/>      
      type: object
      required:
        - ioType
      properties:
        ioType:
          type: integer
          default: null
          minimum: 16
          maximum: 19
          description: |-
            *The following types are used in intrusion*
            - 16: Zone,
            - 17: Area,
            - 18: Wired zone,
            - 19: Area group
          example: 16
        depthLevel:
          type: integer
          default: 0
          minimum: 0
          maximum: 2
          description: 'Depth level 0 (default) indicates that no child objects should be fetched which is always the case for Zones and Wired zones. In case of Areas, depth level of 1 will fetch its child Zones and Wired zones whereas depth level of 0 will only fetch Areas. Depth level 2 can be only used for Area groups in which case its child Areas including Zones and Wired zones in those Areas will be fetched.'
        includeStatusText:
          type: boolean
          default: false
          description: 'This field is only used when fetching intrusion status. When set to true, intrusionStatusResult will include human readable status text fields. '
        ids:
          $ref: '#/components/schemas/idArray'
        techPointIDs:
          $ref: '#/components/schemas/idArray'
    intrusionFilterResult:
      type: object
      required:
        - count
        - records
      properties:
        count:
          type: integer
          description: Total count matching query criteria. This is not the count of records array.
        records:
          type: array
          description: It will be null if there is no data or doNotFetchData is set to true.
          items:
            $ref: '#/components/schemas/intrusionContainer'
    intrusionStatus:
      description: '"id" field is ID of Zone, Wired zone, Area or Area group. If this this is response to intrusion status request, be sure to set intrusionFilter.includeStatusText to true if you want status text to be included in the result.'
      type: object
      required:
        - id
        - ioId
        - ioType
        - state
        - stateFlags
      properties:
        id:
          $ref: '#/components/schemas/id'
        ioId:
          $ref: '#/components/schemas/id'
        ioType:
          type: integer
          description: See intrusionContainer.ioType for details.
          example: 16
        state:
          type: integer
          default: 0
          minimum: 0
          maximum: 6
          description: |-
            The following types are used in intrusion:
            - 0: Unassigned,
            - 1: Unset,
            - 2: Set,
            - 3: Partial set,
            - 4: Disabled,
            - 5: Isolated
            - 6: NotConfigured
          example: 1
        stateFlags:
          type: array
          items:
            type: integer
          description: |-
            The array may be empty. Some of the values below are not applicable to intrusion state (they are part of general IO state flags). Each value is zero based index of a bit in the integer (the actual value used by the system is index to the power of 2, e.g. if value is 7 than system used internal value is 7 to the power of 2 = 128). The values represent:
            - 0: Active [N/A, Not in use],
            - 1: Stimulated,
            - 2: Alarm,
            - 3: Sabotage (open),
            - 4: Sabotage (shorted),
            - 5: Sabotage (comlost),
            - 6: Sabotage (TechPoint lost),
            - 7: Unset,
            - 8: Set,
            - 9: Nigth set,
            - 10: Partial set,
            - 11: Entry timer running,
            - 12: Exit timer running,
            - 13: Isolated,
            - 14: Disabled,
            - 15: Prewarning (autoset),
            - 16: Hidden alarm,
            - 17: External alarm latch,
            - 18: External sabotage latch,
            - 19: Local alarm latch,
            - 20: Local sabotage latch,
            - 21: Not operational,
            - 22: Service mode allowed,
            - 23: In service mode,
            - 24: Not configured,
            - 25: Local latch test failed,
            - 26: External latch test failed,
            - 27: Test active,
            - 28: Set fault. Unable to set area. Reset when set success or accept alarm,
            - 29: AutoSet week program is suppressed,
            - 30: Delay prewarning after unset,
            - 31: Area empty,
            - 32: Area limitation reached.
          example:
            - 7
            - 22
        stateFlagsText:
          type: array
          items:
            type: string
          description: Human readable text representation of stateFlags array.
          example:
            - Unset
            - Service mode allowed
        stateText:
          type: string
          description: 'Human readable text. First part represents the state name, e.g. "Unset" (if state can''t be determined the text will be "???"). Second part of the string, if present, will be separated from first with slash (/) and additional info, e.g. "Unset/In Service".'
          example: Unset/In Service
        stateAttentionText:
          type: string
          description: 'Additional human readable text with important informaton. In case of state Unset/Set/Partial set this could be "Sabotage", "Active", "Passive", "Test failed", "Test active" and if multiple of these are in effect they are separated with slash (/). In case of state Isolated these could be "Active" or "Passive".'
          example: Sabotage
    intrusionStatusResult:
      description: The result of requested intrusion status.
      type: object
      required:
        - count
        - records
      properties:
        count:
          type: integer
          description: Total count matching query criteria. This is not the count of records array.
        records:
          type: array
          items:
            $ref: '#/components/schemas/intrusionStatus'
    intrusionCommand:
      description: 'Execute specified intrusion command on one or more objects. The objects (zones, wired zones, areas and area groups) are identified by their ioId which must be provided inside "ioIDs" array. Typically, "intrusionProfileID" field should be omitted (or set to null) in which case intrusion profile that is linked to the API user account will be used (this can be specified on user editor on "Intrusion profile" tab). <strong>Important: "intrusionProfileID" may be specified only if API user account is system administrator.</strong>'
      type: object
      required:
        - command
        - ioIDs
      properties:
        command:
          type: integer
          minimum: 2
          maximum: 17
          description: |-
            The following command are supported:
            - 2: Unset,
            - 3: Set,
            - 4: Force set,
            - 5: Disable (supported only for Zones)
            - 6: Enable (supported only for Zones)
            - 7: Isolate (supported only for Zones)
            - 8: Accept alarm,
            - 9: Clear alarm only,
            - 10: Clear all, sabotage and alarm
            - 11: Postpone Autoset
            - 14: Allow service
            - 15: Disallow service
            - 16: Set in service
            - 17: Set out of service
          example: 2
        ioIDs:
          type: array
          items:
            $ref: '#/components/schemas/id'
          minItems: 1
          maxItems: 10
        intrusionProfileID:
          $ref: '#/components/schemas/id'
    keybox:
      type: object
      description: Keybox is used as a locker box or safety deposit box which can be controlled in a similar manner like an elevator matrix for a door. Every keybox has a number and belongs to keybox group. Keybox group must be linked to a door in order for keybox to be used. Keybox can be opened using management API.
      required:
        - id
        - number
        - name
        - info
        - groupId
      properties:
        id:
          $ref: '#/components/schemas/id'
        number:
          type: integer
          description: Keybox number
        name:
          type: string
        info:
          type: string
          description: Nullable
        groupId:
          $ref: '#/components/schemas/id'
    keyboxGroup:
      type: object
      description: 'Keybox group is keybox container. It is linked to a door. If not linked to a door (door is null), keyboxes inside can''t be used for management commands. techPointId is derived from door. keyboxes array contains all keyboxes that belong to the group.'
      required:
        - id
        - name
        - info
        - doorId
        - techPointId
        - keyboxes
      properties:
        id:
          $ref: '#/components/schemas/id'
        name:
          type: string
        info:
          type: string
          description: Nullable
        doorId:
          $ref: '#/components/schemas/id'
        techPointId:
          $ref: '#/components/schemas/id'
        keyboxes:
          type: array
          items:
            $ref: '#/components/schemas/keybox'
    keyboxGroupFilter:
      description: |-
        <strong>This type inherits all fields from baseRecordFilter</strong>
        <br/>   
      type: object
      properties:
        ids:
          $ref: '#/components/schemas/idArray'
        doorIDs:
          $ref: '#/components/schemas/idArray'
    keyboxGroupFilterResult:
      description: The result of requested keybox group config.
      type: object
      required:
        - count
        - records
      properties:
        count:
          type: integer
          description: Total count matching query criteria. This is not the count of records array.
        records:
          type: array
          items:
            $ref: '#/components/schemas/keyboxGroup'
    keyboxCommand:
      description: Execute keybox command (open) on one or more keyboxes. The command will fail if keybox's group is not linked to any door or the API user does not have write access to a linked door.
      type: object
      required:
        - command
        - keyboxIDs
      properties:
        command:
          type: integer
          minimum: 1
          maximum: 1
          description: |-
            The following commands are supported:
            - 1: Open
          example: 1
        keyboxIDs:
          type: array
          items:
            $ref: '#/components/schemas/id'
          minItems: 1
          maxItems: 100
    proxyRequest:
      type: object
      required:
        - webMethod
        - isBodyEncoded
        - encodeResponseBody
      properties:
        webMethod:
          type: string
          example: POST
          description: 'Supported values are: GET, POST, PUT, DELETE, PATCH. Value is not case sensitive.'
        isBodyEncoded:
          type: boolean
          description: 'If true, then body field is base64 encoded, otherwise it is JSON.'
          default: false
        body:
          type: object
          description: 'Nullable. If isBodyEncoded is true, then the field is string base64 encoded, otherwise it is JSON object.'
        ignoreConfigHttpHeaders:
          type: boolean
          description: 'If true, then configured http headers for proxy target (env. device) will be discarded.'
          default: false
        httpHeaders:
          type: array
          items:
            $ref: '#/components/schemas/nameValue'
          description: Nullable. Array of http headers.
        encodeResponseBody:
          type: boolean
          description: 'If true, then the field in proxy response will be  base64 encoded, otherwise it will be JSON.'
          default: false
    proxyResponse:
      type: object
      required:
        - isBodyEncoded
        - body
      properties:
        isBodyEncoded:
          type: boolean
          description: 'If true, then body field is base64 encoded, otherwise it is JSON.'
          default: false
        body:
          type: object
          description: Nullable. Depending on isBodyEncoded the field can be string base64 encoded or JSON object.
    nameValue:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          example: Content-Type
        value:
          type: string
          example: application/json
    reader:
      type: object
      required:
        - id
        - instanceNumber
        - name
        - techPointLink
        - type
        - commChannel
        - protocolType
        - linkedDoorIDs
      properties:
        id:
          $ref: '#/components/schemas/id'
        name:
          type: string
          description: Nullable
        type:
          type: integer
          description: |-
            Reader type:
            1: Standard,
            2: Multi door (can be linked to multiple doors)
        instanceNumber:
          type: integer
          description: Nullable
        techPointLink:
          $ref: '#/components/schemas/id'
        commChannel:
          type: integer
          description: |-
            Reader communication channel:
            0 : None,
            1 : RS485 A,
            2 : RS485 B,
            3 : TCP-IP.      
        protocolType:
          type: integer
          description: |-
            Reader protocol type:
            0 : None,
            1 : Deister deBUS,
            2 : Aperio,
            3 : OSDP,
            4 : N/A (type no longer in use),
            5 : Serial bar code Reader,
            6 : Smart Intego (IP),
            7 : Wiegand,
            8 : Siedle Vario.
        linkedDoorIDs:
          type: array
          items:
            $ref: '#/components/schemas/idArray'
          description: Door IDs of doors linked to the reader
    readerFilter:
      description: |-
        <strong>This type inherits all fields from baseRecordFilter</strong>
        <br/>   
      type: object
      properties:
        ids:
          $ref: '#/components/schemas/idArray'
        techPointIDs:
          $ref: '#/components/schemas/idArray'
    readerFilterResult:
      description: The result of requested reader config.
      type: object
      required:
        - count
        - records
      properties:
        count:
          type: integer
          description: Total count matching query criteria. This is not the count of records array.
        records:
          type: array
          items:
            $ref: '#/components/schemas/reader'
    simulateCardRead:
      type: object
      description: 'Door id must be specified. If reader id is not specified, first door''s configured reader will be automatically selected and used. Access card can be identified by card number or chip id. Only one of the field that identify a card can be specified (card number or chip id).'
      required:
        - doorID
      properties:
        doorID:
          $ref: '#/components/schemas/id'
        readerID:
          $ref: '#/components/schemas/id'
        cardNumber:
          type: string
          example: '12345678'
        chipNumber:
          type: integer
          description: Unsigned integer.
        chipNumberBitLength:
          type: integer
          description: Number of bits to take from chipNumber (if field is specified).
          minimum: 1
          maximum: 56
    tableRecord:
      type: object
      required:
        - id
        - tableId
      properties:
        tableId:
          type: integer
          description: |-
            Each table in TechPoint has Id.
            Most common ones:
             1000 : Week programs,
             1002 : Holidays,
             5000 : Card holders,
             5001 : Cards,
             5002 : Access groups
        id:
          $ref: '#/components/schemas/id'
        techPointId:
          $ref: '#/components/schemas/id'
    tableStaticInfo:
      description: Information about system internal SQL table
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: table static id (referenced in e.g. event log details)
          example: 5001
        name:
          type: string
          example: '[Access_Cards]'
    tableCrosstableidRecord:
      type: object
      required:
        - id
        - tableId
      properties:
        tableId:
          type: integer
          description: 
          example: 5001
        id:
          $ref: '#/components/schemas/crossId'
    tableCrossRecord:
      type: object
      required:
        - id
        - tableId
      properties:
        tableId:
          type: integer
          description: Each table in TechPoint has Id. See tableRecord record for list of table ids.
        id:
          $ref: '#/components/schemas/crossId'
        techPointId:
          $ref: '#/components/schemas/id'
      description: TechPoint database full record cross id.
    techPoint:
      type: object
      required:
        - id
        - ipAddress
        - isMaster
        - macAddress
        - name
        - port
        - variantName
        - variantType
        - version
        - syncStatusText
      properties:
        id:
          $ref: '#/components/schemas/id'
        name:
          type: string
        ipAddress:
          type: string
        port:
          type: integer
        macAddress:
          type: string
        isMaster:
          type: boolean
        variantName:
          type: string
        version:
          $ref: '#/components/schemas/version'
        variantType:
          type: integer
        syncStatusText:
          type: string
          example: Synchronized
          description: 'Nullable. Sync status is only returned as not null if specifically requested and if the system is running in multi TechPoint mode. In case of Master, the status is always the same: "N/A". This status text is the same as the one you can see on TechPoint web sync page (under System/Administration/TechPoints), column "Synchronization status". For now, we don''t support integer status codes for sync.'
    weekProgramPeriod:
      type: object
      required:
        - dayNo
        - startSecond
        - function
      properties:
        dayNo:
          type: integer
          minimum: 0
          maximum: 16
          description: |-
            0: Monday,
            1: Tuesday,
            2: Wednesday,
            3: Thursday,
            4: Friday,
            5: Saturday,        
            6: Sunday,
            7: Special I,
            8: Special II,
            9: Special III,
            10: Special IV,
            11: Special V,  
            12: Special VI,
            13: Special VII,
            14: Threat level 1,
            15: Threat level 2,
            16: Threat level 3
        startSecond:
          type: integer
          minimum: 0
          maximum: 86399
          description: Start second at which function starts until next function is defined for the same day.
        function:
          type: integer
          description: |
            |Function | ID |  Week Pr. type |  
            |---------------------|----|---|
            |No Access |20| 10|
            |Access with pincode |21| 10|
            |Access without pincode |22| 10|
            |Toggle with pincode |23| 10|
            |Toggle without pincode |24| 10|
            |Two man rule with pincode |27| 10|
            |Two man rule without pincode |28| 10|
            |Perm until closed with pincode |31| 10|
            |Perm until closed without pincode |32| 10|
            |Office mode without pincode |33| 10|
            |Office mode with pincode |34| 10|
    weekProgram:
      type: object
      description: 'Important: when you are inserting/updating wp periods, there should be week program period for each day with startSecond = 0, otherwise the entry will be automatically added (with default function).'
      required:
        - id
        - type
      properties:
        id:
          $ref: '#/components/schemas/crossId'
        name:
          type: string
          description: Nullable
        type:
          type: integer
          description: |-
            *Currently, only type 10 is allowed.*
            - 1: Door weekprogram,
            - 10: Card holder weekprogram,
            - 11: Output Control,
            - 12: General purpose,
            - 13: Auto set,
            - 100: LogControl 
        isSystem:
          type: boolean
          description: 'If specified by user, it must be set to false.'
          default: false
        periods:
          type: array
          items:
            $ref: '#/components/schemas/weekProgramPeriod'
    watchdogStatus:
      type: object
      description: Current watchdog status.
      required:
        - name
        - isAllowed
        - isActiveNow
        - timeoutSec
        - isRebootEnabled
      properties:
        name:
          type: string
          example: cloud_api
          description: 'Watchdog name. When watchdog is activated from Web API over HTTP/S, the name is ''web_api''. When watchdog is activated from Cloud, the name is ''cloud_api''.'
        isAllowed:
          type: boolean
          description: 'User configurable system settings. When true, watchdog API is enabled.'
        isActiveNow:
          type: boolean
          description: Set to true when watchdog is up & running.
        timeoutSec:
          type: integer
          description: Watchdog timeout in seconds.
        isRebootEnabled:
          type: boolean
          description: Set to true when watchdog action is to reboot the system.
        deactivateIfCloudUnreachable:
          type: boolean
          default: true
          description: 'Only applicable to ''cloud_api'' watchdog. When true, watchdog will be auto deactivated around 10 seconds before timeout if IoT hub host is unreachable.'
    watchdogCommand:
      type: object
      description: 'Command for watchdog. If the command is invoked over HTTP/S, the ''web_api'' watchdog will be affected. If command is invoked over Cloud, ''cloud_api'' watchdog will be affected.'
      required:
        - isActive
        - timeoutSec
      properties:
        isActive:
          type: boolean
          description: 'When true, watchdog will be activated. When false, watchdog will be deactivated.'
        timeoutSec:
          type: integer
          minimum: 60
          maximum: 172800
          description: Watchdog timeout in seconds.
        isRebootEnabled:
          type: boolean
          default: false
          description: Set to true  to reboot the system when watchdog times out. Set to false to only restart Web API/Cloud related processes.
        deactivateIfCloudUnreachable:
          type: boolean
          default: true
          description: 'Only applicable to ''cloud_api'' watchdog. When true (system default), watchdog will be auto deactivated near the end of timeout (sometime in last 10 seconds) if IoT hub host/port is unreachable. This is to prevent reboot when connection to cloud is not possible (e.g. internet connection not working). However, if cloud watchdog is active and about to timeout and this settings is true and system is not connected to the cloud (cloud status is disconnected) but cloud is reachable (its ip/port are reachable) this will still reboot the system (it will not deactivate the watchdog).'
    version:
      type: object
      required:
        - major
        - minor
        - revision
      properties:
        major:
          type: integer
        minor:
          type: integer
        revision:
          type: integer
    arErrorResponse:
      type: object
      required:
        - code
        - msg
      properties:
        code:
          type: integer
          description: |-
            0 : Success,
            1 : General error,
            2 : Request timeout,
            3 : Content missing,
            4 : Destination not found,
            5 : Response error,
            6 : Needs capability report first,
            7 : ??? (internal error),
            8 : Cardless access is not enabled          
        msg:
          type: string
    arEmptyResponse:
      type: object
    arPoll:
      type: object
      properties:
        isSabotage:
          type: boolean
          default: false
    arPollResponse:
      type: object
      required:
        - hasNewConfig
      properties:
        hasNewConfig:
          type: boolean
          default: false
    arReportCapability:
      type: object
      description: |-
        Reports reader capability to the system. 
        Whenever system detects reader is offline (e.g., due to missed polls), reader will have to send capability report before any other action can be performed.     
      properties:
        hasDisplay:
          type: boolean
          default: false
        pollTimeSec:
          type: integer
          default: 90
        inputCount:
          type: integer
          default: 0
    arUserInputCard:
      type: object
      required:
        - cardData
      description: |-
        Regular card read when user presents access card to a reader.
        In case isRawData is set to True, then rawDataBitCount must be present and cardData must be string that can be converted to unsigned integer.
      properties:
        cardData:
          type: string
          default: ''
        isRawData:
          type: boolean
          default: false
        rawDataBitCount:
          type: integer
          default: 0
          minimum: 0
          maximum: 56
    arUserInputCardPin:
      type: object
      description: Card pin code. Typically sent following card read (pin code might be requested depending on access configuration).
      required:
        - pin
      properties:
        pin:
          type: string
    arUserInputCardless:
      type: object
      description: 'Used in case system is configured for cardless access (i.e. entering the pin/code is interpreted as card number instead of actual card read).   '
      required:
        - data
      properties:
        data:
          type: string
    arUserInputKeypad:
      type: object
      description: 'Input from reader keypad.      '
      required:
        - keys
      properties:
        keys:
          type: string
    arUserInputResponse:
      type: object
      description: 'This could be response to arUserInputCard, arUserInputCardPin, arUserInputCardless, or arUserInputKeypad.'
      required:
        - result
        - expectedNextRequestType
        - expectedNextRequestType_Text
        - pincodeLength
      properties:
        result:
          type: integer
          default: 0
          description: |-
            User interaction result code, success/error:
            0 : Success,
            1 : Wrong pin code,
            2 : Not found,
            3 : Invalid site code,
            4 : Read error,
            5 : No keypad,
            6 : Door blocked,
            7 : Door not found,
            8 : Intrusion set,
            9 : Invalid approver,
            10 : Access denied,
            11 : Blocked card used,
            12 : Out of time,
            13 : APB violation,
            14 : Toggle close,
            15 : No pin code,
            16 : Expired,
            17 : Not valid yet,
            18 : Door malfunction,
            19 : Locker locked again,
            20 : Only one locker allowed,
            21 : Card used violation,
            22 : Intrusion rights,
            23 : Intrusion controller,
            24 : Failed to unset,
            25 : Failed to set,
            26 : Pin code change not possible,
            27 : AIR not possible,
            28 : AIR authorizer,
            29 : AIR error,
            30 : AIR timeout,
            31 : Encoding error,
            32 : Not access approver (Card holder cannot approve access), 
            33 : Offline system card (Special Offline system card. Does not open the door),
            34 : Maximum use (Card have been used for specified max use),
            35 : Door GUID missing (Simple Access integration misses DoorGuid),
            36 : Pin code misused (Maximum Pin code attempts is reached),
            37 : Postpone autoset failed,
            38 : Timeout (Panel timeout),
            39 : Intrusion now set, 
            40 : Intrusion now unset, 
            41 : Intrusion now postponed,
            42 : Intrusion internal error,
            43 : Enter new pin code disallowed,
            44 : Change pin code disallowed,
            45 : No Keybox access,
            46 : Denied by threat level,
            47 : Conv. already booked,
            48 : Secure extension license violated,
            49 : APB area full
        expectedNextRequestType:
          type: integer
          default: 0
          description: |-
            Indicates next expected user interaction or error:
            0 : No action (no further interaction is required),
            1 : No access,
            2 : Card not found,
            3 : Out of time,
            4 : Enter pin code,
            5 : Change pin code,
            6 : New pin code,
            7 : Old pin code,
            8 : Verify pin code,
            9 : Invalid pin code,
            10 : Two man rule,
            11 : No Access. ? (Intrusion) is set,
            12 : Intrusion is set (press ..), 
            13 : Intrusion setting.., 
            14 : Intrusion now set,
            15 : Intrusion set failed,
            16 : Intrusion unsetting.., 
            17 : Intrusion unset failed,
            18 : Postpone autoset,
            19 : Autoset postponed,
            20 : Postpone autoset failed,
            21 : Air request (Please wait for verification),
            22 : Card encoded,
            23 : Panel blocked,
            24 : Intrusion alarm,
            25 : Intrusion sabotage,
            26 : Intrusion test failed,
            27 : Intrusion hidden alarm,
            28 : Intrusion prewarning,
            29 : Intrusion entry timer (please unset),
            30 : Intrusion exit timer (please leave the area),
            31 : Offline encoding card,
            32 : APB violation
        expectedNextRequestType_Text:
          type: string
          default: ''
          description: User friendly text explaining next needed interaction (if any).
        pincodeLength:
          type: integer
          default: 0
          description: 'In case pin code is needed (e.g. after card read), this will specify its length.'
    arInputState:
      type: object
      required:
        - number
        - isActive
      properties:
        number:
          type: integer
          description: |-
            Input numbers start at 1.
            If reader has reported 0 inputs, than it cannot be referred to inhere.
            If reader has reported 2 inputs, then first input number is 1 and second is number 2.
          minimum: 1
        isActive:
          type: boolean
          description: Determines if input is to be set to Active (true) or passive (false).
        durationMSec:
          type: integer
          default: 0
          description: Duration of input stimulation in milliseconds.
    arControlInput:
      type: object
      description: 'Interation (json type) ID: 12.       '
      required:
        - inputs
      properties:
        inputs:
          type: array
          items:
            $ref: '#/components/schemas/arInputState'