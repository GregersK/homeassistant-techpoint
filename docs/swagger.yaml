    This API can be used over the internet (see [TechPoint Cloud API](https://app.swaggerhub.com/apis-docs/techsolutions.dk/cloud-tech-point-api/current)).

      


    # General

    Please read this. If you find something unclear, contact [TechSolutions A/S](http://www.techsolutions.dk).
    TechPoint is [IP Door Controller](http://www.techsolutions.dk/products/techpoint-ip-door-controller/).

    <details>
    The API is available over HTTPS; API client will need to obtain TechPoint public key (auto generated for each device) in order to authenticate TechPoint API end point .
    This API does not conform to REST spec.

    **It uses basic HTTP methods (GET, POST, PUT, DELETE) to perform operations on resources (URLs).**

    **JSON format is used for data transfer.**

    **Currently, this API returns only the following HTTP codes: 200, 400, 401, 404, 405, 415, 500 and 503.**

    If API call is successful, HTTP code 200 will be returned with JSON result.

    If API call fails, HTTP error 400 or 500 will be returned with JSON **errorResult** object (HTTP error 500 will be used for internal TechPoint errors).

    If API call fails for reason that resource is not found, HTTP error 404 will be returned with JSON  object **errorResultRecordsNotFound**.


    When GET method returns only single record, the result includes  array but it will contain only single element (this is because of compatibility with other GET methods and for for future use).
    Datetime is specified as UTC time, in ISO 8601 format (result of Date.toJSON in javascript) e.g. 2012-04-23T18:25:43Z or 2012-04-23T18:25:43.511Z.
    In general, if any JSON property is optional that means that is also nullable.

    **Important when using PUT verb for update:<sup>1</sup>**
    * Only specify JSON fields you want to update (except identity), i.e., you have to omit fields you don't want to update.
    * Typically, you must specify identity field (e.g, "id") in order to identify the object you are updating.
    * If you don't want to update certain field, setting the field to null will not suffice - it must be omitted.
    * Therefore the PUT verb used in this API behaves more like PATCH verb.


    **Not fully implemented yet (planned for next versions):**
    * /idmap/resolve is not implemented


    </details>
    </br>
    **How to configure TechPoint to enable WebApi:**

    <details>

    * Acquire TechPoint Api license from Techsolutions and activate it
    * After license is applied (restart), go to System/System Settings/Administration/Web API and make sure that "Enable API" is checked. Save settings.
    * Now, go to user editor (Users/Users) and edit existing or create new user so that on main tab "Enable Web API Access" is checked, and on "Web API rights" tab which will be shown "Allow all" is checked. Save settings. Note that username and password of this user you will use to authenticate to Web API. </details>

    # Change log
    **Changes in 1.13.0 - :**
    * Added DELETE method for idMap
    * Added GET/POST methods for Global door Control
    * Added GET/POST methods for Threat level Control
    * Added GET/POST method for User defined input/Outputs
    * Added new issabotage element for door status

    **Changes in 1.12.0 - id map:** 
    * Added id map endpoint (/idmap POST) which enables setting external id on existing records (already inserted without external id). This can be useful in cases when integration is required with existing system that has already been in use.
    * Added new JSON type idMap.
    * Removed docs for /idmap/resolve (as it is not yet implemented, when implemented, it will likely be /idmap GET).


    **Changes in 1.1.11 - access schedules:** <details>
    * Note that API version jumped from 1.9.0 to 1.11.0 (no 1.10.x). 
    * Intro: The goal is to extend/override door week programs functionality for specific intervals (valid from/to) for which we set the week program door function that will be executed. It is because week programs are limited for weekly execution and this allows much more control. We also support functionality to disable access for specific access group(s) - disable access for card holders in those access groups regardless if they have allowed access in regular settings. For now, for access groups, we only support “No access” function (function null value).
    * Added access schedules configuration endpoints (/config/accessSchedules GET, POST, PUT, DELETE).
    * Added access schedules filter endpoint (/config/accessSchedules/filter POST).
    * Added new JSON types accessSchedule (and related inner types), accessScheduleFilter and accessScheduleFilterResult.
    * Documentation update: removed "EXPERIMENTAL" marker from API-Reader that was added in 1.9.0 and "Alpha" from 1.8.1 - Proxy API (now supported as specified).


    **v1.8.1 and 1.9.0**     
    **Changes in 1.9.0 - API-Reader:**
    * Changed "EXPERIMENTAL" marker for Proxy API to "Alpha" (there were no changes in proxy implementation).
    * API-Reader feature enables you to implement your own card reader just by using this API. It could be software module acting as reader or actual hardware device.
    * It is using API path <strong>/apireader</strong> (/api/v1/apireader).
    * <strong>Important</strong>: You cannot access /apireader path with existing authentication for regular Web API.
    * Start by creating new reader in TechPoint Web UI; under System/Configuration/Card Readers menu click on New. This will open Reader editor. Under "Reader Protocol" tab in "Communication" combo box select "TCP-IP" and in "Reader protocol" combo box select "Web API". After selecting "Web API" in combo box, "Web API" tab will appear where you will see user name and password (autogenerated) for new reader - you need to click on "Save" first.
    * If reader is created in multi TechPoint environment and it is not on Master, you will have to connect to that particular device IP. This information is also shown on "Web API" tab of Reader editor, under "API base URL" field. If reader API is accessed over Cloud, then you can only connect to Master and communication will be appropriately routed to destination device for you.
    * Before you can do any interaction on /apireader, you have to first call /apireader/config/reportCapability. Among other fields, this request contains polling period that TechPoint Server will respect and if "pollTimeSec" is not respected it will mark reader as offline at which point you will have to make API call of reportCapability again. To maintain online presence of a reader, periodically call /apireader/poll.
    * Any interaction under /apireader might cause error response (see arErrorResponse object) and you have to be ready to handle the error. E.g. if you call  /apireader/poll before reporting capability you will get error like: {"errorResponse": { "code": 6, "msg": "Needs capability report first"}}.
    * API-Reader feature allows you to control reported inputs (/apireader/management/input). If reportCapability input count is higher than zero, then TechPoint Server will create reader input objects that you can use and, with combination of linking them to e.g. equations, control the system operations. These inputs are shown in TechPoint Web Ui under System/Configuration/IO/External Inputs.

    **Changes in 1.8.1 - Proxy API:**
    * Web API proxy is used to proxy http/s calls to local pre-configured devices. Primary use case is for secure exposure of local http devices over Cloud API. These devices are currently referred to as "Environment devices". Proxy can be used to interact with local devices (typically on LAN). Env. devices can be configured on TechPoint web page under "System Settings/Administration/Environment devices" so they are allowed to be target of proxy call, otherwise proxy call will be rejected. The HTTP auth. can be configured as well; currently Basic and Bearer authentication are supported plus there is an  option to specify one custom HTTP header that can be used for this purpose (auth. with custom header). Every Env. device has "Proxy handle name" property which is to be used inside URL segment to refer to that particular device. E.g. if you have Env. device with handle name "echo" than you will be able to issue POST call to /api/v1/proxy/echo/some_url_to_pass_to_echo?query_param1=1 and proxy will lookup "echo" device in the configuration, do the necessary authentication, pass a call to it (including URL segment after /echo, query parameters) and return response. Note that proxy does not pass HTTP headers - anything like that must be passed inside proxyRequest JSON object. Alternatively, some http headers can be preconfigured on Env. device configuration page on TechPoint Web. Web method to use can be specified inside proxyRequest.
    * Proxy is supporting non JSON request/responses which can be used to issue any type of http request. In this case proxyRequest.body is base64 encoded which gives total flexibility of what needs to be send to the target.
    * Issuing proxy calls over POST /proxy/{handleName}/{apiPath}.
    * Fetching proxy configuraton. Method: GET /config/proxy.
    * Added JSON types: envDevice, proxyRequest, proxyResponse and nameValue.

    </details>

    **v1.7.x**
    <details>
    **Changes in documentation (June 24, 2024):**
    * Documentation update; crossId JSON object's field "extld" (for external Id) had a typo, the correct value is "extId" (capital letter I, like in word Identity). <sup>2</sup>

    **Changes in 1.7.0 (January 10, 2024), TechPoint v3.8.1 - Keybox API:**
    * Intro: Keybox is used as a locker box or safety deposit box which can be controlled (opened) in a similar manner like an elevator matrix for a door. 
    * Fetching keybox groups and keyboxes with filtering. Method: POST /config/keyboxGroups/filter.
    * Keybox management (open keyboxes). Method POST /management/keybox
    * New JSON types: keybox, keyboxGroup, keyboxGroupFilter, keyboxGroupFilterResult, keyboxCommand.
    * Fetching general static types, for now table ids/names. Method: GET /general/static/types. New JSON types: generalTypesStaticConfig, tableStaticInfo.
    * Fetching realtime techpoint sync status <sup>1</sup>. Use existing method GET /techpoints like: /techpoints?getSyncStatus=1 
    * Added syncStatusText to techPoint JSON type.
    * Modified docs, reordered JSON types.

    </details>

    **v1.6.x**
    <details>
    **Changes in 1.6.0 (December 27/28/29, 2023), TechPoint v3.8.0 - APB (Anti passback) management API and more:**

     * Fetching APB status with filtering (by card, card holder, area, door, reader etc.). Method: POST /management/apb/status.
     
     * APB management (move cards to area, move all cards from one area to another, free specific cards, free all cards in area, free all cards). Method: POST /management/apb.
     
     * New JSON types: apbConfig, apbStatus, apbStatusFilter, apbStatusResult, apbCommand.
     
     * Added field apbConfig to intrusionContainer JSON (for area).
     
     * Added field clearedType to eventFilter which enables fetching events (alarms/alerts) that have not been cleared. <sup>1</sup>
     
     * Bug fix: eventFilterResult, intrusionFilterResult, intrusionStatusResult were not including count (total count) field in the response. count field was missing in intrusionStatusResult spec as well.
     
     * Modified docs, reduced repetition by adding baseRecordFilter JSON which is never used directly but as a base class for: cardFilter, cardHolderFilter, eventFilter, doorFilter, intrusionFilter, and apbStatusFilter.
     
     * Added API GET /access/static/types for fetching static access related types configuration including card options. <sup>1</sup> Added related JSON types accessTypesStaticConfig and accessCardOptionStaticInfo. Note that card options 4 and 8 are no longer supported (from TechPoint v3.1.0) and new option 13 is added (from TechPoint v3.7.2).
     * Added API POST /config/readers/filter for fetching readers. New JSON types: reader, readerFilter, readerFilterResult.

    </details>
    <br/> 
    **v1.5.x**
    <details>
    **Changes in 1.5.2 (December 19, 2023), TechPoint v3.7.2 - bug fixes:**

     * eventFilter JSON object (used in e.g. POST /events/filter) would failed to be parsed when "id" field was specified. <sup>1</sup>
     
     * The result of POST /management/intrusion/status where intrusionFilter JSON specified "ioType" was 17 (areas) was fetching also io types 16 (zones) and 18 (Wired zones) even when "depthLevel" was default (0). <sup>1</sup>

     * Documentation update; in intrusionFilter JSON object, the "ioType" field wasn't marked as mandatory. <sup>1</sup>
     


    **Changes in documentation (November 20, 2023):**
    * Documentation update; clarification of week program and week program periods default behavior - system will automatically insert missing entries if not present during insert/update (for each day there must be entry with startSecond equal to 0). Week program dayNo range increased (docs. was not up to date).

    **Changes in 1.5.1 (November 14, 2023), TechPoint v3.4.0 - API for clear event, fetching event types information and bug fix:**

     * Added clear event API /events/clear POST. Added related JSON types eventClearCommand and eventClearResult.
     
     * Added API /events/static/types GET for fetching static event types/tags configuration. Added related JSON types eventTypesStaticConfig, eventTypeStaticInfo and eventTagStaticInfo. <sup>1</sup>
     
    * Bug fix: POST /management/intrusion was not respecting non explicit intrusion profile account under which is executed resulting in unsuccessful execution of intrusion command. <sup>1</sup>
    * Documentation update: clarification regarding usage of PUT verb in General section. <sup>1</sup> 
    * Documentation update: restructured document header (collapsible details section).
    </details>
    <br/>
    **v1.4.0 - v1.0.0:**
    <details>


    **Changes in 1.4.0 (August 18, 2023) - intrusion management API:**

    * Fetching zones, wired zones, areas, and area groups. Methods: POST /config/intrusion/zones/filter, POST /config/intrusion/wiredzones/filter, POST /config/intrusion/areas/filter and POST /config/intrusion/areagroups/filter.
    * Intrusion management (e.g. set/unset). Methods: POST /management/intrusion/status to fetch status and POST /management/intrusion to set status.
    * Fetching intrusion profiles. Method: GET /config/intrusion/profiles.
    * New json types: intrusionProfile, intrusionContainer, intrusionFilter, intrusionFilterResult, intrusionStatus, intrusionStatusResult, intrusionCommand.
    * Note: intrusion configuration (create, update and delete for wired zones, areas, area groups, and intrusion profiles) is not supported.
    * <strong>Important</strong>: If intrusion functionality is disabled (default), the intrusion API will return error "Intrusion disabled. Please enable.." . To enable intrusion, go to System/Administration/Intrusion and check "Enabled" checkbox. 


    **Changes in documentation (August 16, 2023):**
    * Documentation update (no changes in the API): /config/doors/filter and /management/doors/status were missing request body definition.

        

    **Changes in documentation (August 4, 2023):**
    * Documentation update (no changes in the API): apiInfo json object returned by GET /info/api had "techPoint" field which was a typo (there is only "version" field).



    **Changes in 1.3.1 (June 9, 2023) - watchdog:**
    * Added bool property "isRebootEnabled" to JSON types watchdogStatus and watchdogCommand. This property controls if system will reboot when watchdog times out or it willl restart processes. By default isRebootEnabled is false and system will not reboot.
    * After reboot or processes restart, watchdog is always deactivated. After custom watchdog caused reboot, system eventlog entry with restart cause 20 is created. If processes are restarted, system eventlog entry "Custom watchdog restarted process(es)" is inserted.
    * Minor corrections regarding reboot in previous Change log in v1.3.0 marked with "(text updated June 9 2023)" and underlined.


    **Changes in 1.3.0 (May 24, 2023) - watchdog:**
    * Added watchdog API /system/watchdog GET and POST. 
    * Added JSON types watchdogStatus and watchdogCommand.
    * Added /ping GET for fast ping (recommended for watchdog timer reset). 
    * To enable watchdog API, you have to allow it on Web API configuration page in case you wil be using it over HTTP/S (local LAN), or on Cloud configuration page in case you will be using it over Cloud API. Both watchdogs (web api and cloud api) have separate configurations and separate timers. It is possible to use them both simultaneously. When using /system/watchdog POST you can't specify  which watchdog you are managing; it is inferred from the context of your invocation (LAN or Cloud).
    * Please use with caution. **Warning**: when watchdog is activated, the system will be rebooted <u>(or processes will be restarted)(text updated June 9 2023)</u> if no successful API call is received within defined timeout period **for whatever reason** (unless watchdogCommand.deactivateIfCloudUnreachable is true and timer is watchdog gets deactivated). Any successful API call will reset the watchdog to configured timeout and delay the watchdog action.
    * After reboot, watchdog is always deactivated.
    * Successful API call definition (that will reset watchdog timeout); For local Web API (LAN), API call is considered successful if it returns HTTP status code 200 OK. For cloud, API call is considered successful if both (1) the same as Web API (HTTP status must be 200 OK) AND (2) Device cloud method invocation status is success (as well 200 OK) - this is status code returned to cloud IoT Hub (on the internet) that had initiated the call on behalf of external Cloud API user (through Cloud API).


    **Changes in 1.2.0 (March 15, 2023):**
    * Support for external ID inside event details; in terms of JSON types, type for eventDetails.relatedRecord is changed from tableRecord to tableCrossRecord. Backward compatibility is preserved (as tableRecord is subset of tableCrossRecord).


    **Changes in 1.1.0:**
    * Added /access/cardAccess PUT method that can be used to set access for multiple cards in single API call. Added cardAccess json type definition which is used as the parameter.

    **Changes in documentation:**

     * Documentation update (no changes in the API): 
    In the following objects there was a typo where the field type was specified as number instead of integer: doorStatus (positionCause, exception, intrusionState), doorCommand (newDoorState), door (instanceNumber) and in method GET /config/weekprograms (type).

    **Changes in 1.0.0:**

    * Version bump from 0 to 1 because of introduction of new feature called Domains (compatibility is preserved)
    * Added /domains GET method which will return all Domains in the system
    * For objects that are linked to domain(s), added field domainLinks which is array of id objects and represents the Domain links for that object. Note that this funcionality is enabled only if in user editor "Include domain links" option is checked (under "Web API rights" tab).
    * <strong>Important</strong>: When the system is configured for multiple domains, the user account under which the API is used will determine what data will be returned; in case user is on Domain X, he will only be able to read records that belong to that domain and if that user creates a record it will be automatically linked to Domain X (e.g. created card holder will belong to Domain X). However, if user account is Administrator then it will be possible to configure the account to get records from all domains (under "Web API rights" tab, the option "Include data from all domains" needs to be checked) - but in this case all created records will belong to Default Domain (future versions might add support for creating records on any domain for Administrator).
    * Added suport for webhook configuration per Domain

     </details>
     <br/>
     
     **v0.9.3 and lower:**

     <details>

    **Changes in 0.9.3:**
    * Support for access card's options field (read/write)
    * Added <strong>/management/simulatecardread</strong> method which can be used to simulate card read on specific door remotely causing the door to open if the card has proper access rights. Breaking change: endpoint test/cardread and testCardRead object are removed (if you were using it, simply rename the end point and in your POST, rename "testCardRead" to "simulateCardRead").
    * Bug fix, the result of methods access/cardHolders/filter and access/cards/filter did not include extId field.



    **Changes in 0.9.2:**
    * Improvement in week program period duplication checks.

    **Changes in 0.9.1:**

    * Support for accessRights insert/update as part of [accessGroup](#/accessGroup)
    * Added priority and isReusable fields on accessGroup (they were not exposed before)

    **Changes in 0.9.0:**
    * Valid from/to fields on cardAccessGroupLink now supported
    * New type accessRight. 
    * accessRight array added to accessGroup but readonly for now
    * accessRight array added to door (readonly) if doorFilter specifies includeAccessRights 


    **Changes in 0.8.2:**
    * New API doc hosting on https://app.swaggerhub.com. 
    * Added week program configuration (/config/weekprograms)
    * Added holidays configuration (/config/holidays)
    * Added access card test method (/test/cardread). You can now issue a card swipe event and see what happens in eventlog. 

    **Changes in 0.8.0:**
    *  Support for fetching door list
    *  Support for fetching door status and door management (open, close, etc.)
    *  New types: door, doorFilter, doorStatus, doorCommand
    *  New endpoints: "/config/doors/filter", "/management/doors/status" and "/management/doors"
    *  Documentation; added new sections: Configuration, Management

    **Changes in 0.7.0:**
    *  Bug fix; PUT methods for access card holders,  access cards and access groups were expecting all fields and update unspecified fields (now only id field is required)
    *  External ID support for  access card holders,  access cards and access groups
    *  Added  new section in documentation  "Guidelines and Info" (update how to use GET method properly). Moved uncategorized items to new section Main.

    **Changes in 0.6.0 from 0.5.0:**
    *  techPoint type, added field variantType
    *  event type, eventTime can be null
    *  eventFilter type, eventDetailsTypes removed
    *  eventFilter type, techPoints array added
    *  eventWebHook type, removed Digest auth type
    *  POST /events/webhook/test is expecting field name "event"
    *  POST /access/accessGroups is returning { "accessGroup" :{...}}
    *  POST /access/cards is returning { "card" :{...}}
    *  POST /access/cardHolders is returning { "cardHolder" :{...}}
    *  POST /access/cards/filter is expecting {"cardFilter":{}}
    *  POST /access/cardHolders/filter is expecting {"cardHolderFilter":{}}
    </details>
    <p>
