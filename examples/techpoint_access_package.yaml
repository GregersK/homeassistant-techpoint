# TechPoint Access Management – HA Package
#
# Copy to: config/packages/techpoint_access.yaml
# Enable packages in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages

input_text:
  # --- Cardholder ---
  techpoint_ch_firstname:
    name: "First name"
    icon: mdi:account
    initial: ""
  techpoint_ch_lastname:
    name: "Last name"
    icon: mdi:account
    initial: ""
  techpoint_ch_ext_id:
    name: "External ID (optional)"
    icon: mdi:identifier
    initial: ""

  # --- Card ---
  techpoint_card_number:
    name: "Card number"
    icon: mdi:card-account-details
    initial: ""

input_select:
  # --- Access groups (populated via "Load access groups" button) ---
  techpoint_access_group_1:
    name: "Access group 1"
    options:
      - "(none)"
    icon: mdi:door
  techpoint_access_group_2:
    name: "Access group 2"
    options:
      - "(none)"
    icon: mdi:door
  techpoint_access_group_3:
    name: "Access group 3"
    options:
      - "(none)"
    icon: mdi:door

  # --- Cardholder management list ---
  techpoint_cardholder_list:
    name: "Cardholder"
    options:
      - "(none)"
    icon: mdi:account-circle

  # --- Threat level ---
  techpoint_threat_level:
    name: "Threat level"
    options:
      - "0:Off"
      - "1:Normal"
      - "2:Level 1"
      - "3:Level 2"
      - "4:Level 3"
    icon: mdi:alert

input_datetime:
  techpoint_card_valid_from:
    name: "Valid from"
    has_date: true
    has_time: true
  techpoint_card_valid_to:
    name: "Valid to"
    has_date: true
    has_time: true
  techpoint_manage_valid_to:
    name: "New valid to (management)"
    has_date: true
    has_time: true

script:
  # ── Load access groups from TechPoint into dropdowns ──────────────
  techpoint_load_access_groups:
    alias: "TechPoint: Load access groups"
    icon: mdi:refresh
    sequence:
      - service: techpoint.access_get_groups
        response_variable: resp
      - service: input_select.set_options
        target:
          entity_id:
            - input_select.techpoint_access_group_1
            - input_select.techpoint_access_group_2
            - input_select.techpoint_access_group_3
        data:
          # Format: "1:Main door", "2:Admin" – ID before colon used for assignment
          options: >
            {% set groups = resp.get('access_groups', []) %}
            {% set ns = namespace(items=['(none)']) %}
            {% for g in groups %}
              {% set raw_id = g.get('id') %}
              {% set gid = raw_id.get('id') if raw_id is mapping else raw_id %}
              {% if gid is not none %}
                {% set ns.items = ns.items + [gid | string + ':' + g.get('name', '(unknown)')] %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}

  # ── Load cardholders from TechPoint into dropdown ──────────────────
  techpoint_load_cardholders:
    alias: "TechPoint: Load cardholders"
    icon: mdi:account-multiple
    sequence:
      - service: techpoint.access_list_cardholders
        response_variable: ch_resp
      - service: techpoint.access_list_cards
        response_variable: card_resp
      - service: input_select.set_options
        target:
          entity_id: input_select.techpoint_cardholder_list
        data:
          # Format: "ch_id:card_id:Name (card_num)" – parsed by management scripts
          options: >
            {% set chs = ch_resp.get('cardholders', []) %}
            {% set cards = card_resp.get('cards', []) %}
            {% set ns = namespace(items=['(none)']) %}
            {% for ch in chs %}
              {% set raw_id = ch.get('id') %}
              {% set ch_id = raw_id.get('id', 0) if raw_id is mapping else (raw_id | int(0)) %}
              {% if ch_id > 0 %}
                {% set fn = ch.get('firstName', '') %}
                {% set ln = ch.get('lastName', '') %}
                {% set card_ids = ch.get('cardIDs', {}).get('ids', []) %}
                {% set first_card_id = card_ids[0].get('id', 0) if card_ids else 0 %}
                {% set ns2 = namespace(nums=[]) %}
                {% for cid_obj in card_ids %}
                  {% set this_cid = cid_obj.get('id', 0) %}
                  {% for c in cards %}
                    {% set craw = c.get('id') %}
                    {% set c_id_val = craw.get('id') if craw is mapping else (craw | int(0)) %}
                    {% if c_id_val == this_cid and c.get('number') %}
                      {% set ns2.nums = ns2.nums + [c.get('number') | string] %}
                    {% endif %}
                  {% endfor %}
                {% endfor %}
                {% set label = (fn + ' ' + ln).strip() %}
                {% if ns2.nums %}
                  {% set label = label + ' (' + ns2.nums | join(', ') + ')' %}
                {% endif %}
                {% set ns.items = ns.items + [ch_id|string + ':' + first_card_id|string + ':' + label] %}
              {% endif %}
            {% endfor %}
            {{ ns.items }}

  # ── Create cardholder, card & assign access ────────────────────────
  techpoint_full_flow:
    alias: "TechPoint: Create cardholder, card & assign access"
    icon: mdi:shield-account-outline
    sequence:

      # ── Step 1: Create cardholder ────────────────────────────────
      - service: techpoint.access_create_cardholder
        response_variable: ch_response
        data:
          body:
            firstName: "{{ states('input_text.techpoint_ch_firstname') }}"
            lastName: "{{ states('input_text.techpoint_ch_lastname') }}"
            id:
              extId: "{{ states('input_text.techpoint_ch_ext_id') or none }}"

      # ── Step 2: Store cardholder ID ──────────────────────────────
      - variables:
          ch_id: "{{ ch_response['cardholder_id'] }}"

      # ── Step 3: Create card ──────────────────────────────────────
      - service: techpoint.access_create_card
        response_variable: card_response
        data:
          body:
            number: "{{ states('input_text.techpoint_card_number') }}"
            cardHolderID:
              id: "{{ ch_id }}"
            validFrom: "{{ states('input_datetime.techpoint_card_valid_from') | replace(' ', 'T') }}Z"
            validTo: "{{ states('input_datetime.techpoint_card_valid_to') | replace(' ', 'T') }}Z"
            active: true

      # ── Step 4: Resolve access group IDs from dropdowns ─────────
      - variables:
          # Format in dropdown: "3:Main door" → split on ':' → first part as int
          ag1: >
            {% set sel = states('input_select.techpoint_access_group_1') %}
            {{ 0 if sel == '(none)' else (sel.split(':') | first | int(0)) }}
          ag2: >
            {% set sel = states('input_select.techpoint_access_group_2') %}
            {{ 0 if sel == '(none)' else (sel.split(':') | first | int(0)) }}
          ag3: >
            {% set sel = states('input_select.techpoint_access_group_3') %}
            {{ 0 if sel == '(none)' else (sel.split(':') | first | int(0)) }}

      # ── Step 5: Update card with access group links ──────────────
      # Access groups live on the card (accessGroupLinks), not the cardholder
      - service: techpoint.access_update_card
        response_variable: _update_response
        data:
          card_id: "{{ card_response['card_id'] }}"
          body:
            number: "{{ states('input_text.techpoint_card_number') }}"
            cardHolderID:
              id: "{{ ch_id }}"
            validFrom: "{{ states('input_datetime.techpoint_card_valid_from') | replace(' ', 'T') }}Z"
            validTo: "{{ states('input_datetime.techpoint_card_valid_to') | replace(' ', 'T') }}Z"
            active: true
            accessGroupLinks: >
              {{ ([{'accessGroupID': {'id': ag1}}] if ag1 > 0 else []) +
                 ([{'accessGroupID': {'id': ag2}}] if ag2 > 0 else []) +
                 ([{'accessGroupID': {'id': ag3}}] if ag3 > 0 else []) }}

      # ── Step 6: Success notification ────────────────────────────
      - service: persistent_notification.create
        data:
          title: "TechPoint: Access created"
          message: >
            Cardholder: {{ states('input_text.techpoint_ch_firstname') }} {{ states('input_text.techpoint_ch_lastname') }}
            Card: {{ states('input_text.techpoint_card_number') }}
            Valid to: {{ states('input_datetime.techpoint_card_valid_to') }}

  # ── Update selected cardholder: expiry date and access groups ──────
  techpoint_update_selected:
    alias: "TechPoint: Update selected cardholder"
    icon: mdi:account-edit
    sequence:
      - variables:
          sel: "{{ states('input_select.techpoint_cardholder_list') }}"
          ch_id: "{{ sel.split(':')[0] | int(0) }}"
          card_id: "{{ sel.split(':')[1] | int(0) }}"
          ag1: >
            {% set s = states('input_select.techpoint_access_group_1') %}
            {{ 0 if s == '(none)' else (s.split(':') | first | int(0)) }}
          ag2: >
            {% set s = states('input_select.techpoint_access_group_2') %}
            {{ 0 if s == '(none)' else (s.split(':') | first | int(0)) }}
          ag3: >
            {% set s = states('input_select.techpoint_access_group_3') %}
            {{ 0 if s == '(none)' else (s.split(':') | first | int(0)) }}

      # Guard: abort if no valid cardholder selected
      - condition: template
        value_template: "{{ ch_id > 0 }}"

      # Update cardholder expiry
      - service: techpoint.access_update_cardholder
        response_variable: _ch_update_response
        data:
          body:
            id:
              id: "{{ ch_id }}"
            validTo: "{{ states('input_datetime.techpoint_manage_valid_to') | replace(' ', 'T') }}Z"

      # Update card access groups (only if a card is linked)
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ card_id > 0 }}"
            sequence:
              - service: techpoint.access_update_card
                response_variable: _card_update_response
                data:
                  card_id: "{{ card_id }}"
                  body:
                    accessGroupLinks: >
                      {{ ([{'accessGroupID': {'id': ag1}}] if ag1 > 0 else []) +
                         ([{'accessGroupID': {'id': ag2}}] if ag2 > 0 else []) +
                         ([{'accessGroupID': {'id': ag3}}] if ag3 > 0 else []) }}

      - service: persistent_notification.create
        data:
          title: "TechPoint: Updated"
          message: "Cardholder {{ sel.split(':')[2] | default('') }} has been updated."

  # ── Delete selected cardholder and their linked card ───────────────
  techpoint_delete_selected:
    alias: "TechPoint: Delete selected cardholder"
    icon: mdi:account-remove
    sequence:
      - variables:
          sel: "{{ states('input_select.techpoint_cardholder_list') }}"
          ch_id: "{{ sel.split(':')[0] | int(0) }}"
          card_id: "{{ sel.split(':')[1] | int(0) }}"

      # Guard: abort if no valid cardholder selected
      - condition: template
        value_template: "{{ ch_id > 0 }}"

      # Delete linked card first (if one exists)
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ card_id > 0 }}"
            sequence:
              - service: techpoint.access_delete_card
                data:
                  card_id: "{{ card_id }}"

      # Delete cardholder
      - service: techpoint.access_delete_cardholder
        data:
          id: "{{ ch_id }}"

      # Refresh cardholder list
      - service: script.techpoint_load_cardholders

      - service: persistent_notification.create
        data:
          title: "TechPoint: Deleted"
          message: "Cardholder {{ sel.split(':')[2] | default('') }} has been deleted."

  # ── Set threat level from dropdown ─────────────────────────────────
  techpoint_apply_threat_level:
    alias: "TechPoint: Apply threat level"
    icon: mdi:alert
    sequence:
      - service: techpoint.management_set_threat_level
        data:
          level: "{{ states('input_select.techpoint_threat_level').split(':') | first | int(0) }}"
      - service: persistent_notification.create
        data:
          title: "TechPoint: Threat level"
          message: "Threat level set to: {{ states('input_select.techpoint_threat_level') }}"

  # ── Open all globally-controlled doors ─────────────────────────────
  techpoint_global_door_open:
    alias: "TechPoint: Open all doors (global)"
    icon: mdi:door-open
    sequence:
      - service: techpoint.management_set_global_door_control
        data:
          active: true
      - service: persistent_notification.create
        data:
          title: "TechPoint: Global door control"
          message: "All globally-controlled doors have been opened."

  # ── Release (close) all globally-controlled doors ──────────────────
  techpoint_global_door_release:
    alias: "TechPoint: Release global door control"
    icon: mdi:door-closed
    sequence:
      - service: techpoint.management_set_global_door_control
        data:
          active: false
      - service: persistent_notification.create
        data:
          title: "TechPoint: Global door control"
          message: "Global door control released — doors returned to normal."
